  namespace: ecommerce
spec:
  selector:
    app: user-auth-service
  ports:
  - name: http
    port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-auth-service
  template:
    metadata:
      labels:
        app: user-auth-service
    spec:
      containers:
      - name: user-auth-service
        image: ecommerce/auth-service:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: AUTH_DB_PASSWORD
        - name: DATABASE_URL
          value: postgresql+psycopg2://auth_user:$(AUTH_DB_PASSWORD)@auth-db:5432/auth_db
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRE_MINUTES
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: JWT_EXPIRE_MINUTES
        - name: AUTH_EXPOSE_VERIFICATION_CODE
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: AUTH_EXPOSE_VERIFICATION_CODE
        - name: DB_CONNECT_RETRIES
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: DB_CONNECT_RETRIES
        - name: DB_CONNECT_RETRY_DELAY_SECONDS
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: DB_CONNECT_RETRY_DELAY_SECONDS
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 750m
            memory: 512Mi
