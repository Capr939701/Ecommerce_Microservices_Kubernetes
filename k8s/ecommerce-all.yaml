apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  JWT_EXPIRE_MINUTES: '1440'
  AUTH_EXPOSE_VERIFICATION_CODE: 'true'
  GATEWAY_TIMEOUT_SECONDS: '10'
  USER_AUTH_URL: http://user-auth-service:8001
  PRODUCT_SERVICE_URL: http://product-service:8002
  ORDER_SERVICE_URL: http://order-service:8004
  PAYMENT_SERVICE_URL: http://payment-service:8003
  CART_SERVICE_URL: http://cart-service:8005
  PRODUCT_TIMEOUT_SECONDS: '5'
  PAYMENT_TIMEOUT_SECONDS: '10'
  ORDER_TIMEOUT_SECONDS: '15'
  DB_CONNECT_RETRIES: '10'
  DB_CONNECT_RETRY_DELAY_SECONDS: '2'
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: ecommerce
spec:
  clusterIP: None
  selector:
    app: auth-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: ecommerce
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: auth_db
        - name: POSTGRES_USER
          value: auth_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: AUTH_DB_PASSWORD
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
